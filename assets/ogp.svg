<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8a70"/>
      <stop offset="1" stop-color="#0c5e4b"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#063a2d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="260" fill="#ffffff" opacity="0.05"/>
  <circle cx="180" cy="560" r="180" fill="#ffffff" opacity="0.04"/>

  <!-- eyebrow -->
  <text x="80" y="120" font-family="'Noto Sans JP',sans-serif" font-size="26" font-weight="700"
        fill="#bff0e1" letter-spacing="6">CHOISOKO HINO &#183; OPEN DATA DASHBOARD</text>

  <!-- タイトル -->
  <text x="80" y="210" font-family="'Zen Maru Gothic','Noto Sans JP',sans-serif" font-size="78"
        font-weight="700" fill="#ffffff">チョイソコひの</text>
  <text x="80" y="290" font-family="'Zen Maru Gothic','Noto Sans JP',sans-serif" font-size="52"
        font-weight="700" fill="#ffffff">利用状況ダッシュボード</text>

  <!-- サブ -->
  <text x="82" y="345" font-family="'Noto Sans JP',sans-serif" font-size="26" fill="#d7f0e8">
    滋賀県日野町のデマンド型乗合交通 ｜ 運行開始からの累計データを視覚化</text>

  <!-- KPIチップ -->
  <g font-family="'Noto Sans JP',sans-serif">
    <!-- chip1 -->
    <rect x="80" y="395" width="220" height="130" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="104" y="438" font-size="22" fill="#bff0e1" font-weight="700">累計 利用件数</text>
    <text x="104" y="495" font-size="54" fill="#ffffff" font-weight="700">30,855<tspan font-size="26" fill="#d7f0e8"> 件</tspan></text>

    <!-- chip2 -->
    <rect x="316" y="395" width="200" height="130" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="340" y="438" font-size="22" fill="#bff0e1" font-weight="700">登録会員数</text>
    <text x="340" y="495" font-size="54" fill="#ffffff" font-weight="700">2,771<tspan font-size="26" fill="#d7f0e8"> 人</tspan></text>

    <!-- chip3 -->
    <rect x="532" y="395" width="180" height="130" rx="18" fill="#e8862e"/>
    <text x="556" y="438" font-size="22" fill="#fff3e7" font-weight="700">乗合率</text>
    <text x="556" y="495" font-size="54" fill="#ffffff" font-weight="700">1.41<tspan font-size="24" fill="#fff3e7"> 人/便</tspan></text>
  </g>

  <!-- スパークライン（利用件数の伸び R5.3→R8.9） -->
  <g filter="url(#soft)">
    <path d="M 620.0,470 L 620.0,470.0 L 632.1,457.2 L 644.3,455.3 L 656.4,452.6 L 668.6,450.5 L 680.7,453.0 L 692.9,440.6 L 705.0,451.5 L 717.1,454.3 L 729.3,454.0 L 741.4,462.3 L 753.6,462.0 L 765.7,456.4 L 777.9,454.0 L 790.0,453.4 L 802.1,452.4 L 814.3,451.6 L 826.4,462.2 L 838.6,446.7 L 850.7,439.8 L 862.9,440.3 L 875.0,446.2 L 887.1,449.3 L 899.3,448.2 L 911.4,433.6 L 923.6,407.4 L 935.7,413.6 L 947.9,406.8 L 960.0,401.0 L 972.1,410.6 L 984.3,396.6 L 996.4,390.9 L 1008.6,409.7 L 1020.7,401.4 L 1032.9,406.1 L 1045.0,398.2 L 1057.1,371.2 L 1069.3,363.2 L 1081.4,364.4 L 1093.6,328.0 L 1105.7,328.1 L 1117.9,362.6 L 1130.0,320.0 L 1130.0,470 Z"
          fill="url(#area)"/>
    <path d="M 620.0,470.0 L 632.1,457.2 L 644.3,455.3 L 656.4,452.6 L 668.6,450.5 L 680.7,453.0 L 692.9,440.6 L 705.0,451.5 L 717.1,454.3 L 729.3,454.0 L 741.4,462.3 L 753.6,462.0 L 765.7,456.4 L 777.9,454.0 L 790.0,453.4 L 802.1,452.4 L 814.3,451.6 L 826.4,462.2 L 838.6,446.7 L 850.7,439.8 L 862.9,440.3 L 875.0,446.2 L 887.1,449.3 L 899.3,448.2 L 911.4,433.6 L 923.6,407.4 L 935.7,413.6 L 947.9,406.8 L 960.0,401.0 L 972.1,410.6 L 984.3,396.6 L 996.4,390.9 L 1008.6,409.7 L 1020.7,401.4 L 1032.9,406.1 L 1045.0,398.2 L 1057.1,371.2 L 1069.3,363.2 L 1081.4,364.4 L 1093.6,328.0 L 1105.7,328.1 L 1117.9,362.6 L 1130.0,320.0"
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1130" cy="320" r="9" fill="#e8862e" stroke="#ffffff" stroke-width="3"/>
  </g>
  <text x="620" y="305" font-family="'Noto Sans JP',sans-serif" font-size="20" fill="#bff0e1">
    月別利用件数の推移（R5.3 → R8.9）</text>

  <!-- フッターライン -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  <text x="80" y="595" font-family="'Noto Sans JP',sans-serif" font-size="22" fill="#9fd9c9">
    オープンデータ利活用の実証実験（プロトタイプ）</text>
</svg>
